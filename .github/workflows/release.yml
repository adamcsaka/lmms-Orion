name: Release LMMS Orion

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v8.0.0)'
        required: true
        default: 'v8.0.0'
      release_name:
        description: 'Release Name / Title'
        required: true
        default: 'LMMS Orion v8.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Plugins excluded from release builds (match deploy-v9.ps1 packaging):
#   CarlaBase/CarlaPatchbay/CarlaRack - unreliable on Windows targets
#   Vestige - VST2-only bridge, superseded by ModularSynth
#   ZynAddSubFX - randomizer crashes
# Note: PLUGIN_LIST is a ;-separated CMake list internally; spaces are the
# documented user-facing separator and are converted by PluginList.cmake.
env:
  PLUGIN_LIST: >-
    Amplifier BassBooster BitInvader Bitcrush Compressor CrossoverEQ Delay
    Dispersion DualFilter DynamicsProcessor Eq Flanger FrequencyShifter
    GranularPitchShifter HydrogenImport LadspaBrowser LadspaEffect LOMM
    Lv2Effect Lv2Instrument Lb302 MidiImport MidiExport MultitapEcho
    ModularSynth Monstro Nes OpulenZ Organic Oscilloscope FreeBoy Patman
    PeakControllerEffect GigPlayer ReverbSC Sf2Player Sfxr Sid
    SlewDistortion SlicerT SpectrumAnalyzer StereoEnhancer StereoMatrix
    Stk TapTempo VstBase VstEffect Watsyn WaveShaper Vectorscope Vibed
    Xpressive

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache vcpkg dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          key: vcpkg-msvc-x86_64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-msvc-x86_64-
          path: build\vcpkg_installed

      - name: Cache ccache data
        uses: actions/cache@v4
        with:
          key: ccache-release-msvc-x64-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-release-msvc-x64-${{ github.ref }}-
            ccache-release-msvc-x64-
          path: ~\AppData\Local\ccache

      - name: Install tools
        run: choco install ccache nsis ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          archives: qtbase qtsvg qttools
          cache: true

      - name: Set up MSVC build environment
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Configure CMake
        run: |
          mkdir build -Force
          cmake -S . `
            -B build `
            -G Ninja `
            --toolchain C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DTARGET_UARCH=official `
            -DWANT_QT6=ON `
            -DPLUGIN_LIST="${{ env.PLUGIN_LIST }}" `
            -DUSE_COMPILE_CACHE=ON `
            -DUSE_WERROR=OFF `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DVCPKG_HOST_TRIPLET="x64-windows"

      - name: Build LMMS
        run: cmake --build build

      - name: Package Portable ZIP & Installer
        run: |
          cmake --install build --prefix build\portable
          $zipName = "LMMS-Orion-v8-win64-portable.zip"
          Compress-Archive -Path build\portable\* -DestinationPath "build\$zipName"
          cmake --build build --target package || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/LMMS-Orion-v7-win64-portable.zip
            build/lmms-*.exe

  linux:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt) \
            extra-cmake-modules ninja-build libfltk1.3-dev || true
          # Qt6 is required (WANT_QT6=ON); install it separately so a missing
          # package fails loudly instead of being masked by the || true above.
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6svg6-dev qt6-tools-dev-tools

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTARGET_UARCH=official \
            -DWANT_QT6=ON \
            -DPLUGIN_LIST="${{ env.PLUGIN_LIST }}" \
            -DUSE_WERROR=OFF \
            -DWANT_DEBUG_CPACK=ON

      - name: Build LMMS
        run: cmake --build build

      - name: Package AppImage
        run: |
          cmake --build build --target package || true
          if ! ls build/*.AppImage 1> /dev/null 2>&1; then
            cpack --config build/CPackConfig.cmake -G TGZ -B build || true
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            build/*.AppImage
            build/*.tar.gz

  macos:
    name: Build macOS x86_64 DMG
    continue-on-error: true
    runs-on: macos-13
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_UPGRADE: 1
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install qt@6 ninja sdl2 libsamplerate libsndfile libvorbis libogg fltk fftw || true
          pipx install dmgbuild || true
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTARGET_UARCH=official \
            -DWANT_QT6=ON \
            -DPLUGIN_LIST="${{ env.PLUGIN_LIST }}" \
            -DUSE_WERROR=OFF

      - name: Build LMMS
        run: cmake --build build

      - name: Package DMG
        run: |
          cmake --build build --target package || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            build/*.dmg
            build/*.zip

  publish-release:
    name: Publish GitHub Release
    # macOS is intentionally excluded: macos-13 runners never get scheduled on
    # this account, which would block publishing forever. The macos job still
    # runs opportunistically; when it produces a DMG it can be added to the
    # release manually.
    timeout-minutes: 30
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten and list artifacts
        run: |
          mkdir -p final-assets
          find release-artifacts -type f -exec cp {} final-assets/ \;
          ls -la final-assets

      - name: Determine Tag and Title
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "title=LMMS Orion ${TAG}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
